<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="SELENE: explorador de sitios de alunizaje. Compara sitios y fechas en el polo sur lunar según la luz solar y la comunicación con la Tierra."
    />
    <title>SELENE · Hubble27</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="app.skip"></a>

    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M16 5a11 11 0 0 1 0 22a7 11 0 0 0 0-22z" fill="currentColor" />
        </svg>
        <div>
          <p class="brand-name">SELENE</p>
          <p class="brand-sub" data-i18n="app.tagline"></p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="badge badge-warn" data-i18n="app.modelBadge" data-i18n-attr="title:app.modelBadgeHint"></span>
        <div class="segmented" role="group" data-i18n-attr="aria-label:app.language">
          <button type="button" data-lang="es">ES</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="intro">
        <h1 data-i18n="app.title"></h1>
        <p data-i18n="app.lead"></p>
      </section>

      <div class="dashboard">
        <!-- Columna izquierda: lectura instantánea -->
        <section class="card-group area-metrics" aria-labelledby="metrics-title">
          <div class="group-head">
            <div>
              <p class="eyebrow" data-i18n="metrics.eyebrow"></p>
              <h2 id="metrics-title" data-i18n="metrics.title"></h2>
            </div>
            <span class="chip mono" id="metrics-stamp"></span>
          </div>
          <div class="metric-grid" id="metric-grid"></div>
        </section>

        <!-- Centro: mapa -->
        <section class="card area-map" aria-labelledby="map-title">
          <div class="card-head">
            <div>
              <p class="eyebrow" id="map-eyebrow"></p>
              <h2 id="map-title"></h2>
            </div>
            <div class="segmented" role="group" data-i18n-attr="aria-label:map.viewLabel">
              <button type="button" data-map-view="polar" data-i18n="map.polar"></button>
              <button type="button" data-map-view="global" data-i18n="map.global"></button>
            </div>
          </div>
          <div class="map-stage" id="map-stage">
            <canvas id="heat-canvas" width="720" height="720" aria-hidden="true"></canvas>
            <img id="global-map" src="./img/luna-global.png" alt="" hidden />
            <svg id="map-overlay" role="img"></svg>
            <div class="map-busy" id="map-busy" hidden data-i18n="map.computing"></div>
          </div>
          <div class="map-foot">
            <div class="segmented small" role="group" id="heat-mode" data-i18n-attr="aria-label:map.heatLabel">
              <button type="button" data-heat="sun" data-i18n="map.heatSun"></button>
              <button type="button" data-heat="earth" data-i18n="map.heatEarth"></button>
            </div>
            <div class="heat-legend" id="heat-legend">
              <span class="mono">0 %</span>
              <span class="heat-ramp"></span>
              <span class="mono">100 %</span>
            </div>
          </div>
          <p class="hint" id="map-hint"></p>
        </section>

        <!-- Derecha: configuración -->
        <aside class="card area-setup" aria-labelledby="setup-title">
          <p class="eyebrow" data-i18n="setup.eyebrow"></p>
          <h2 id="setup-title" class="sr-only" data-i18n="setup.eyebrow"></h2>

          <label class="field">
            <span class="field-label" data-i18n="setup.site"></span>
            <select id="site-select"></select>
          </label>
          <div class="chips" id="site-chips" role="group" data-i18n-attr="aria-label:setup.presets"></div>
          <p class="site-note" id="site-note"></p>

          <hr />
          <div class="field-row">
            <label class="field">
              <span class="field-label" data-i18n="setup.lat"></span>
              <input id="lat-input" type="number" min="-90" max="90" step="0.01" inputmode="decimal" />
            </label>
            <label class="field">
              <span class="field-label" data-i18n="setup.lon"></span>
              <input id="lon-input" type="number" min="-180" max="180" step="0.01" inputmode="decimal" />
            </label>
          </div>

          <hr />
          <label class="field">
            <span class="field-label" data-i18n="setup.start"></span>
            <input id="start-input" type="datetime-local" />
          </label>
          <div class="lunar-shift" role="group" data-i18n-attr="aria-label:setup.shiftLabel">
            <button type="button" class="btn ghost small" data-shift="-1" data-i18n="setup.prevLunarDay"></button>
            <button type="button" class="btn ghost small" data-shift="1" data-i18n="setup.nextLunarDay"></button>
          </div>

          <label class="field">
            <span class="field-label field-label-row">
              <span data-i18n="setup.window"></span>
              <output id="window-output" class="mono"></output>
            </span>
            <input id="window-input" type="range" min="1" max="30" step="1" />
          </label>

          <button type="button" class="btn primary block" id="pin-scenario" data-i18n="compare.pin"></button>
        </aside>

        <!-- Izquierda abajo: energía y comunicación -->
        <section class="area-status" aria-label="Estado" data-i18n-attr="aria-label:status.label">
          <article class="card status-card" id="energy-card"></article>
          <article class="card status-card" id="comm-card"></article>
        </section>

        <!-- Derecha abajo: viabilidad -->
        <section class="card area-viability" id="viability" aria-labelledby="viability-title"></section>
      </div>

      <!-- Simulación -->
      <section class="simulation" aria-labelledby="sim-title">
        <div class="section-head">
          <div>
            <p class="eyebrow" data-i18n="sim.eyebrow"></p>
            <h2 id="sim-title" data-i18n="sim.title"></h2>
          </div>
          <p class="section-sub" data-i18n="sim.subtitle"></p>
        </div>

        <div class="panorama card" id="panorama">
          <svg id="panorama-svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid slice" role="img"></svg>
          <span class="pill pano-site" id="pano-site"></span>
          <div class="pano-clock">
            <span class="mono" id="pano-date"></span>
            <strong id="pano-time"></strong>
            <span class="mono" id="pano-mission"></span>
          </div>
          <span class="pill pano-status" id="pano-status"></span>
          <p class="pano-caption mono" data-i18n="sim.caption"></p>
        </div>

        <article class="card insight" id="insight" aria-live="polite"></article>

        <div class="card timeline">
          <div class="timeline-top">
            <div>
              <p class="eyebrow" data-i18n="sim.missionTime"></p>
              <strong class="mission-clock mono" id="mission-clock"></strong>
            </div>
            <div class="playback">
              <button type="button" class="btn icon" id="step-back" data-i18n-attr="aria-label:sim.back">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6" /></svg>
              </button>
              <button type="button" class="btn play" id="play-toggle"></button>
              <button type="button" class="btn icon" id="step-forward" data-i18n-attr="aria-label:sim.forward">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6l6 6-6 6M5 6l6 6-6 6" /></svg>
              </button>
              <label class="speed">
                <span data-i18n="sim.speed"></span>
                <select id="speed-select">
                  <option value="1">1×</option>
                  <option value="6">6×</option>
                  <option value="24">24×</option>
                </select>
              </label>
              <span class="hint mono" data-i18n="sim.speedHint"></span>
            </div>
          </div>
          <div class="scrub-head">
            <span class="eyebrow" data-i18n="sim.drag"></span>
            <span class="mono accent-sun" id="scrub-date"></span>
          </div>
          <input type="range" id="time-range" class="time-range" min="0" max="1000" step="1" data-i18n-attr="aria-label:sim.missionTime" />
          <div class="scrub-ticks mono" id="scrub-ticks"></div>
        </div>

        <div class="card windows">
          <div class="card-head">
            <div>
              <h3 data-i18n="windows.title"></h3>
              <p class="section-sub" id="windows-sub"></p>
            </div>
            <div class="legend">
              <span><i class="swatch sun"></i><span data-i18n="windows.sun"></span></span>
              <span><i class="swatch earth"></i><span data-i18n="windows.link"></span></span>
            </div>
          </div>
          <div class="windows-chart" id="windows-chart" tabindex="0" role="slider" data-i18n-attr="aria-label:windows.slider"></div>
          <div class="windows-foot">
            <span data-i18n="windows.help"></span>
            <span class="mono" data-i18n="windows.keys"></span>
          </div>
        </div>
      </section>

      <!-- Comparador -->
      <section class="compare" aria-labelledby="compare-title">
        <div class="section-head">
          <div>
            <p class="eyebrow" data-i18n="compare.eyebrow"></p>
            <h2 id="compare-title" data-i18n="compare.title"></h2>
          </div>
          <p class="section-sub" data-i18n="compare.subtitle"></p>
        </div>
        <div class="card" id="compare-body"></div>
      </section>

      <!-- Cómo funciona -->
      <section class="about" aria-labelledby="about-title">
        <div class="section-head">
          <div>
            <p class="eyebrow" data-i18n="about.eyebrow"></p>
            <h2 id="about-title" data-i18n="about.title"></h2>
          </div>
        </div>
        <div class="about-grid">
          <article class="card">
            <h3 data-i18n="about.whyTitle"></h3>
            <p data-i18n="about.whyBody"></p>
          </article>
          <article class="card">
            <h3 data-i18n="about.howTitle"></h3>
            <p data-i18n="about.howBody"></p>
          </article>
          <article class="card">
            <h3 data-i18n="about.dataTitle"></h3>
            <p data-i18n="about.dataBody"></p>
            <ul class="sources">
              <li><a href="https://ssd.jpl.nasa.gov/horizons/" target="_blank" rel="noopener">JPL Horizons</a></li>
              <li><a href="https://pds-geosciences.wustl.edu/missions/lro/lola.htm" target="_blank" rel="noopener">LRO · LOLA</a></li>
              <li><a href="https://quickmap.lroc.asu.edu/" target="_blank" rel="noopener">LROC Quickmap</a></li>
              <li><a href="https://trek.nasa.gov/moon/" target="_blank" rel="noopener">NASA Moon Trek</a></li>
            </ul>
          </article>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p data-i18n="app.footer"></p>
      <p class="mono" data-i18n="app.disclaimer"></p>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
