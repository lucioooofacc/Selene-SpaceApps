<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>SELENE</title>
    <link rel="icon" href="./figma/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Luna de fondo animada (DEC-060): decorativa, detrás de la página -->
    <div class="moon-backdrop" aria-hidden="true">
      <div class="moon-backdrop-sphere"><div class="moon-backdrop-map" style="background-image: url('./nasa/lroc_color_4k.jpg')"></div></div>
    </div>
    <div class="stage" id="stage">
      <!-- Vista 6: encabezado -->
      <header class="header">
        <img class="header-logo" src="./figma/logo.png" alt="" width="80" height="64" />
        <p class="header-brand">SELENE</p>
        <nav class="header-nav" data-i18n-attr="aria-label:nav.label">
          <a href="#mision" data-i18n="nav.mission"></a>
          <a href="./compare.html" data-compare-link data-i18n="nav.compare"></a>
          <a href="./informe.html" data-informe-link data-i18n="nav.report"></a>
          <!-- Recorrido guiado (UI-16, DEC-066) -->
          <button type="button" id="tour-button" data-i18n="nav.guide"></button>
        </nav>
        <div class="header-actions">
          <button type="button" class="icon-button" id="lang-toggle" data-i18n-attr="aria-label:nav.language;title:nav.language">
            <img src="./figma/icon-globe.svg" alt="" width="46" height="46" />
          </button>
          <button type="button" class="icon-button" id="settings-button" data-i18n-attr="aria-label:nav.settings;title:nav.settings">
            <img src="./figma/icon-gear.svg" alt="" width="44" height="44" style="width:44px;height:44px" />
          </button>
        </div>
      </header>

      <!-- Vista 1 -->
      <main class="view" id="mision">
        <div class="top-row">
          <!-- Mejores lugares para alunizar -->
          <div class="places-column" id="comparar">
            <section class="places" aria-labelledby="places-title">
              <button type="button" class="help-button" data-help="places" aria-haspopup="dialog" aria-expanded="false" data-i18n-attr="aria-label:help.open.places;title:help.open.places">?</button>
              <h2 class="places-title" id="places-title">
                <span class="sr-only" data-i18n="places.title"></span>
                <!-- Lugares / Fechas (DEC-046), con el patrón de pestañas del mapa -->
                <span class="places-modes" role="tablist" data-i18n-attr="aria-label:places.modeLabel">
                  <button type="button" role="tab" data-places-mode="sites" data-i18n="places.mode.sites"></button>
                  <span aria-hidden="true">/</span>
                  <button type="button" role="tab" data-places-mode="dates" data-i18n="places.mode.dates"></button>
                </span>
              </h2>
              <div class="places-categories" id="places-categories" role="radiogroup" data-i18n-attr="aria-label:places.categoryLabel">
                <button type="button" role="radio" data-category="overall" data-i18n="places.category.overall"></button>
                <button type="button" role="radio" data-category="science" data-i18n="places.category.science"></button>
                <button type="button" role="radio" data-category="communication" data-i18n="places.category.communication"></button>
                <button type="button" role="radio" data-category="light" data-i18n="places.category.light"></button>
              </div>
              <ol class="places-list" id="places-list"></ol>
              <p class="places-hint" id="places-hint" aria-live="polite"></p>
            </section>
            <a class="places-link" href="./compare.html" data-compare-link data-i18n="places.link"></a>
          </div>

          <!-- Mapa -->
          <section class="map-card" data-i18n-attr="aria-label:map.label">
            <button type="button" class="help-button" data-help="map" aria-haspopup="dialog" aria-expanded="false" data-i18n-attr="aria-label:help.open.map;title:help.open.map">?</button>
            <div class="map-tabs" role="tablist" data-i18n-attr="aria-label:map.tabsLabel">
              <button type="button" role="tab" data-map-view="global" data-i18n="map.global"></button>
              <span class="map-tabs-sep" aria-hidden="true">/</span>
              <button type="button" role="tab" data-map-view="heat" data-i18n="map.heat"></button>
              <span class="map-tabs-sep" aria-hidden="true">/</span>
              <button type="button" role="tab" data-map-view="polar" data-i18n="map.polar"></button>
            </div>
            <div class="map-tabs-line" aria-hidden="true">
              <img class="map-tabs-full" src="./figma/title-line-full.svg" alt="" width="460" height="3" />
              <img class="map-tabs-accent" id="map-tabs-accent" src="./figma/title-line-accent.svg" alt="" width="208" height="3" />
            </div>
            <div class="map-mode" id="map-mode" role="group" data-i18n-attr="aria-label:map.modeLabel" hidden>
              <button type="button" data-map-mode="3d" aria-pressed="true" data-i18n="map.mode3d"></button>
              <button type="button" data-map-mode="2d" aria-pressed="false" data-i18n="map.mode2d"></button>
            </div>
            <div class="heat-layers" id="heat-layers" role="group" data-i18n-attr="aria-label:map.layerLabel" hidden>
              <button type="button" data-heat-layer="elevation" aria-pressed="true" data-i18n="map.layer.elevation"></button>
              <button type="button" data-heat-layer="sun" aria-pressed="false" data-i18n="map.layer.sun"></button>
              <button type="button" data-heat-layer="earth" aria-pressed="false" data-i18n="map.layer.earth"></button>
              <button type="button" data-heat-layer="both" aria-pressed="false" data-i18n="map.layer.both"></button>
              <button type="button" data-heat-layer="viability" aria-pressed="false" data-i18n="map.layer.viability"></button>
            </div>
            <div class="map-area" id="map-area">
              <img class="map-image" id="map-image" alt="" />
              <div class="map-pins" id="map-pins"></div>
              <p class="map-status map-status-loading" data-i18n="map.loading"></p>
              <p class="map-status map-status-error" data-i18n="map.noWebgl"></p>
            </div>
            <p class="map-credit" id="map-credit" hidden></p>
            <div class="map-legend" id="map-legend" role="img" hidden></div>

            <div class="map-add">
              <button type="button" class="map-add-button" id="add-site" aria-haspopup="dialog" aria-expanded="false" aria-controls="add-menu" data-i18n-attr="aria-label:map.addSite;title:map.addSite">
                <img src="./figma/btn-plus.svg" alt="" width="40" height="40" />
              </button>
              <!-- Menú del "+" (DEC-043): en el Figma era el texto al lado del botón -->
              <form class="map-add-menu" id="add-menu" role="dialog" aria-labelledby="add-menu-title" hidden>
                <p class="map-add-title" id="add-menu-title" data-i18n="map.addSite"></p>
                <p class="map-add-coords" id="add-menu-coords"></p>
                <label class="map-add-label" for="add-menu-name" data-i18n="map.addName"></label>
                <input type="text" id="add-menu-name" maxlength="40" autocomplete="off" required />
                <div class="map-add-actions">
                  <button type="button" class="map-add-cancel" id="add-menu-cancel" data-i18n="map.addCancel"></button>
                  <button type="submit" class="map-add-confirm" data-i18n="map.addConfirm"></button>
                </div>
              </form>
            </div>
            <div class="map-coords" aria-live="polite">
              <div class="map-coord">
                <span data-i18n="params.lat"></span>
                <strong id="map-lat"></strong>
              </div>
              <div class="map-coord">
                <span data-i18n="params.lon"></span>
                <strong id="map-lon"></strong>
              </div>
            </div>
          </section>

          <!-- Parámetros de la misión -->
          <aside class="params" aria-labelledby="params-title">
            <h2 class="params-title" id="params-title" data-i18n="params.title" data-i18n-attr="title:params.dataHint"></h2>
            <button type="button" class="help-button" data-help="params" aria-haspopup="dialog" aria-expanded="false" data-i18n-attr="aria-label:help.open.params;title:help.open.params">?</button>
            <button type="button" class="params-quality" id="quality-button" aria-haspopup="dialog" data-i18n-attr="aria-label:quality.open;title:quality.open">i</button>
            <label class="params-label" for="site-select" data-i18n="params.site"></label>
            <div class="params-select">
              <select id="site-select"></select>
              <img src="./figma/param-arrow.svg" alt="" width="8" height="16" />
            </div>
            <div class="params-chips" id="site-chips"></div>
            <hr class="params-rule" />
            <div class="params-coords">
              <label>
                <span class="params-label" data-i18n="params.lat"></span>
                <input id="lat-input" type="number" min="-90" max="90" step="0.01" />
              </label>
              <label>
                <span class="params-label" data-i18n="params.lon"></span>
                <input id="lon-input" type="number" min="-180" max="180" step="0.01" />
              </label>
            </div>
            <span class="params-label params-label-duration" data-i18n="params.duration"></span>
            <div class="params-date">
              <button type="button" class="params-date-button" id="date-button" aria-haspopup="dialog" aria-expanded="false"></button>
              <div class="calendar" id="calendar" role="dialog" hidden></div>
            </div>
            <hr class="params-rule params-rule-2" />
            <span class="params-label params-label-window" data-i18n="params.window"></span>
            <div class="criteria" id="criteria"></div>
          </aside>
        </div>

        <!-- Comportamiento de los cuerpos celestes -->
        <section class="behavior" aria-labelledby="behavior-title">
          <h2 class="behavior-title" id="behavior-title" data-i18n="behavior.title"></h2>
          <button type="button" class="help-button" data-help="panorama" aria-haspopup="dialog" aria-expanded="false" data-i18n-attr="aria-label:help.open.panorama;title:help.open.panorama">?</button>
          <div class="behavior-grid">
            <div class="behavior-left">
              <div class="panorama" id="panorama">
                <svg id="panorama-svg" viewBox="0 0 1240 544" role="img"></svg>
                <span class="pano-pill pano-site" id="pano-site"></span>
                <div class="pano-clock">
                  <span id="pano-date"></span>
                  <strong id="pano-time"></strong>
                  <span id="pano-mission"></span>
                </div>
                <span class="pano-pill pano-status" id="pano-status"></span>
                <!-- Leyenda del panorama (UI-16, DEC-066): un renglón por dato, con su etiqueta -->
                <dl class="pano-legend" id="pano-legend"></dl>
              </div>

              <div class="timeline">
                <div class="timeline-top">
                  <div>
                    <p class="mono-label" data-i18n="sim.missionTime"></p>
                    <strong class="mission-clock" id="mission-clock"></strong>
                  </div>
                  <div class="playback">
                    <button type="button" class="tl-button" id="step-back" data-i18n-attr="aria-label:sim.back">«</button>
                    <button type="button" class="tl-play" id="play-toggle"></button>
                    <button type="button" class="tl-button" id="step-forward" data-i18n-attr="aria-label:sim.forward">»</button>
                    <label class="tl-speed">
                      <span data-i18n="sim.speed"></span>
                      <select id="speed-select">
                        <option value="1">1×</option>
                        <option value="6">6×</option>
                        <option value="24">24×</option>
                      </select>
                    </label>
                    <span class="tl-hint" data-i18n="sim.speedHint"></span>
                  </div>
                </div>
                <div class="scrub-head">
                  <span class="mono-label" data-i18n="sim.drag"></span>
                  <span class="scrub-date" id="scrub-date"></span>
                </div>
                <!-- Elegir una fecha y hora exactas para ver si el Sol y la Tierra son visibles (UI-15) -->
                <div class="tl-goto">
                  <label for="time-input" data-i18n="sim.goto"></label>
                  <input type="datetime-local" id="time-input" step="600" />
                  <span class="tl-goto-utc">UTC</span>
                  <p class="tl-goto-result" id="time-visibility" aria-live="polite"></p>
                </div>
                <!-- Tramos del período con el modelo aproximado del Sol y la Tierra (UI-02, DEC-041) -->
                <div class="scrub-coverage" id="scrub-coverage" aria-hidden="true"></div>
                <input type="range" id="time-range" class="time-range" min="0" max="1000" step="1" data-i18n-attr="aria-label:sim.missionTime" />
                <div class="scrub-ticks" id="scrub-ticks"></div>
                <p class="scrub-coverage-note" id="scrub-coverage-note" hidden></p>
              </div>
            </div>

            <div class="behavior-right">
              <button type="button" class="help-button" data-help="status" aria-haspopup="dialog" aria-expanded="false" data-i18n-attr="aria-label:help.open.status;title:help.open.status">?</button>
              <article class="status-card" id="energy-card"></article>
              <article class="status-card" id="comm-card"></article>
              <article class="insight" id="insight" aria-live="polite"></article>
              <article class="status-card period-card" id="period-card" aria-labelledby="period-title"></article>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Informe imprimible (UI-06): oculto en pantalla, visible al imprimir -->
    <article class="report" id="report"></article>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
